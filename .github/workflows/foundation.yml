name: Shared platform foundation
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/shared/**'
      - 'development/contracts/**'
      - 'development/platforms/**'
      - 'development/*Foundation*'
      - 'development/test_platform_foundation.py'
      - 'development/Test-BehaviorParity.ps1'
      - 'development/Test-CiExitStatus.ps1'
      - 'app/Convert-Manga.ps1'
      - 'app/Workflow-Support.ps1'
      - 'app/Chapter-Support.ps1'
      - 'app/Book-Labels.ps1'
      - 'app/Originals-Handling.ps1'
      - 'development/Test-ChapterBundles.ps1'
      - 'development/Test-BookLabels.ps1'
      - 'development/Test-FilenameMarkers.ps1'
      - 'development/Test-WholeVolumes.ps1'
      - 'development/Test-OriginalHandling.ps1'
      - 'app/Services.cs'
      - '.github/workflows/foundation.yml'
  pull_request:
    paths:
      - 'app/shared/**'
      - 'development/contracts/**'
      - 'development/platforms/**'
      - 'development/*Foundation*'
      - 'development/test_platform_foundation.py'
      - 'development/Test-BehaviorParity.ps1'
      - 'development/Test-CiExitStatus.ps1'
      - 'app/Convert-Manga.ps1'
      - 'app/Workflow-Support.ps1'
      - 'app/Chapter-Support.ps1'
      - 'app/Book-Labels.ps1'
      - 'app/Originals-Handling.ps1'
      - 'development/Test-ChapterBundles.ps1'
      - 'development/Test-BookLabels.ps1'
      - 'development/Test-FilenameMarkers.ps1'
      - 'development/Test-WholeVolumes.ps1'
      - 'development/Test-OriginalHandling.ps1'
      - 'app/Services.cs'
      - '.github/workflows/foundation.yml'
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        python: ['3.8', '3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Validate shared contracts and inventory
        run: python -B development/test_platform_foundation.py
      - name: Replay shared corpus against current Windows worker
        if: runner.os == 'Windows' && matrix.python == '3.11'
        shell: powershell
        run: ./development/Test-CiExitStatus.ps1
      - name: Check chapter grouping and retained originals
        if: runner.os == 'Windows' && matrix.python == '3.11'
        shell: powershell
        run: |
          ./development/Test-ChapterBundles.ps1
          ./development/Test-BookLabels.ps1
          ./development/Test-FilenameMarkers.ps1
          ./development/Test-WholeVolumes.ps1
          ./development/Test-OriginalHandling.ps1
