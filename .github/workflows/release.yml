name: Prepare KCCAutomate release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New release version matching the app, for example 0.1.19'
        required: true
        type: string
concurrency:
  group: kccautomate-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check shared contracts and Windows behavior parity
        shell: powershell
        run: |
          ./development/Test-PlatformFoundation.ps1
          ./development/Test-BehaviorParity.ps1
      - name: Check release preparation safeguards
        shell: powershell
        run: ./development/Test-ReleasePreparation.ps1
      - name: Build portable app
        shell: powershell
        run: ./development/Build-App.ps1
      - name: Test conversion workflow and JPEG XL preparation
        shell: powershell
        run: |
          ./development/Test-Workflow.ps1
          ./development/Test-ChapterBundles.ps1
          ./development/Test-BookLabels.ps1
          ./development/Test-FilenameMarkers.ps1
          ./development/Test-OutputFolders.ps1
          ./development/Test-LeadingTags.ps1
          ./development/Test-FolderSeries.ps1
          ./development/Test-WholeVolumes.ps1
          ./development/Test-OriginalHandling.ps1
          ./development/Test-JxlPreprocessing.ps1
          ./development/Test-Upgrades.ps1
          ./development/Test-Duplicates.ps1
          ./development/Test-ToolSetup.ps1
          ./development/Test-KccCompatibility.ps1
      - name: Test desktop and update validation without opening a window
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path development/test-results -Force | Out-Null
          $report = Join-Path $pwd 'development/test-results\desktop.txt'
          $p = Start-Process -FilePath .\development\dist\KCCAutomate\KCCAutomate.exe -ArgumentList @('--self-test', ('"' + $report + '"')) -WindowStyle Hidden -Wait -PassThru
          Get-Content -LiteralPath $report
          if ($p.ExitCode) { throw 'Desktop tests failed.' }
      - name: Package app
        shell: powershell
        run: ./development/Package-App.ps1 -SkipBuild
      - name: Build Windows installer
        shell: powershell
        run: ./development/Build-Installer.ps1 -SkipPackage
      - name: Test installation and isolated setup conversion
        shell: powershell
        run: |
          ./development/Test-Installation.ps1
          ./development/Test-AppIcon.ps1
          ./development/Test-TaskbarIcon.ps1
      - name: Save build downloads
        uses: actions/upload-artifact@v7
        with:
          name: KCCAutomate-Windows
          if-no-files-found: error
          path: |
            development/dist/KCCAutomate-Setup.exe
            development/dist/KCCAutomate-Windows.zip
            development/dist/SHA256SUMS
      - name: Prepare draft release with downloads
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./development/Prepare-Release.ps1 -Version $env:RELEASE_VERSION -Repository $env:GITHUB_REPOSITORY -Commit $env:GITHUB_SHA
